name: ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Gateway tests
        working-directory: apps/gateway
        run: go test ./...
      - name: Contract tests
        working-directory: packages/contract/go
        run: go test ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated types match schema
        run: python3 packages/contract/codegen/generate.py --check --go packages/contract/go/contract.go --ts packages/contract/ts/index.ts

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Console tests
        working-directory: apps/console
        run: npm ci && npm test
      - name: Console types
        working-directory: apps/console
        run: npm run typecheck

  # 跨仓库 token 一致性守卫退休于前端重建（docs/frontend-rebuild/）。
  #
  # 它的前提是「边缘面板逐个手抄云端的 token 名字和值」——lib/tokens.ts 的文件头
  # 曾写着「在这里改一个 token 名字，等于改了另一个仓库」。两端各自换框架之后这个
  # 前提不成立：云端用 shadcn 的语义变量（--background/--primary/--secondary…），
  # 边缘端要换成 Leptos + Thaw UI，不会再有这些名字。
  #
  # ⚠️ 后果是两端的视觉从此**各走各的**。这是这次重建的直接结果，不是疏忽。

  lone-cr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The guard can still tell a lone CR from a merely mixed file
        # Runs FIRST, deliberately. A scan that reports "none found" is worth
        # nothing unless something has just demonstrated it is still able to find
        # one. That matters more than usual here: this guard's byte classifier is
        # a verbatim copy of an out-of-tree original, so its behaviour has to be
        # shown in this repo rather than assumed from the file it was copied from.
        #
        # 12 cases, both directions. The load-bearing negative is MIXED line
        # endings WITHOUT a lone CR: SN-T025 found 7 mixed files and only 1 with a
        # lone CR, so a guard that conflated them would fire on 6 innocent files
        # and be switched off within a day.
        run: node scripts/check-lone-cr.cjs --self-test
      - name: No tracked text file carries an undeclared lone CR
        # The root is passed explicitly. The script has no default and exits 2
        # rather than silently scoring whatever directory it happened to start in
        # -- the same defect the tokens job above had to fix.
        #
        # Scope is THIS repo only. vodoge-edge and the docs repo are NOT scanned
        # from here. A gate belongs in the repo it gates: a red light that the
        # author of this PR has no way to clear is one that gets learned around,
        # and an edge commit cannot be blocked by a cloud workflow anyway. Wiring
        # those two is separate work and is named as an open gap in SN-T031.
        #
        # core.autocrlf is off on this runner, so worktree bytes are the committed
        # bytes. What this gates is therefore a lone CR ENTERING the repository.
        # It does NOT gate what a Windows checkout later does to a worktree.
        run: node scripts/check-lone-cr.cjs "$GITHUB_WORKSPACE"

  # Every migration, applied in order to an empty database.
  #
  # Applying them one at a time to a fresh database is the only thing that
  # proves the set can be replayed — which is what a restore does, and what
  # setting up a second region would do. Until this existed, a migration that
  # only worked against the one live database would pass every check here and
  # fail the first time anyone needed it.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vodoge
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vodoge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vodoge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Roles the schema depends on
        env:
          PGPASSWORD: ci
        # The policies reference these by name, so an empty database cannot
        # take the migrations without them. Passwords are irrelevant here —
        # every one of these is NOLOGIN.
        run: |
          psql -h localhost -U vodoge -d vodoge -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vodoge_owner NOLOGIN;
          CREATE ROLE vodoge_app NOLOGIN;
          CREATE ROLE vodoge_gateway NOLOGIN IN ROLE vodoge_app;
          CREATE ROLE vodoge_dispatcher NOLOGIN IN ROLE vodoge_app;
          CREATE ROLE vodoge_resolver NOLOGIN BYPASSRLS;
          GRANT vodoge_owner TO vodoge;
          GRANT vodoge_resolver TO vodoge;
          SQL
      - name: Replay every migration in order
        env:
          PGPASSWORD: ci
          PSQL_DIRECT: "1"
        # The same runner production uses, so this exercises the real thing
        # rather than a second code path that only exists for CI.
        run: ./deploy/bin/migrate.sh packages/db/migrations/*.sql
      - name: Every table with a tenant_id enforces isolation
        env:
          PGPASSWORD: ci
        # A table holding tenant data without FORCE row level security is the
        # one mistake in this schema that nothing else would catch: it works
        # perfectly, and shows every tenant everyone else's rows.
        run: |
          unguarded=$(psql -h localhost -U vodoge -d vodoge -tAc "
            SELECT string_agg(c.relname, ' ')
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_attribute a ON a.attrelid = c.oid AND a.attname = 'tenant_id'
             WHERE n.nspname = 'app'
               AND c.relkind = 'r'
               AND NOT c.relforcerowsecurity")
          if [ -n "$unguarded" ]; then
            echo "these hold tenant data without FORCE row level security: $unguarded"
            exit 1
          fi
          echo "every tenant table enforces isolation"
      - name: Every command the catalogue can build is a value the table accepts
        env:
          PGPASSWORD: ci
        # 🔴 Written after the same gap shipped twice — migrations 0052 and
        # 0054 both exist because a command kind reached production without
        # its enum value. The failure is invisible to every Go test: the
        # catalogue builds a valid payload, the gateway validates it, and
        # PostgreSQL rejects it at INSERT. The catalogue's own tests build
        # payloads and never store one, so nothing there can see it.
        #
        # This is the one place both halves are available at once: the Go
        # source that declares the kinds, and a database with the enum in it.
        run: |
          cd apps/gateway
          go run ./cmd/list-command-kinds > /tmp/kinds.txt
          cd -
          missing=$(psql -h localhost -U vodoge -d vodoge -tAc "
            SELECT string_agg(k, ' ')
              FROM unnest(ARRAY[$(sed "s/.*/'&'/" /tmp/kinds.txt | paste -sd, -)]) AS k
             WHERE k NOT IN (
                 SELECT unnest(enum_range(NULL::app.command_kind))::text)")
          if [ -n "$missing" ]; then
            echo "these command kinds have no enum value, so issuing one fails at INSERT: $missing"
            echo "add them in a new migration, following packages/db/migrations/0054"
            exit 1
          fi
          echo "every catalogue kind is storable ($(wc -l < /tmp/kinds.txt) kinds)"
      - name: Every sequenced uplink kind the contract defines is one accept_ingress accepts
        env:
          PGPASSWORD: ci
        # 🔴 同样的洞已经在生产上开过一次：0044 那次 CREATE OR REPLACE 把
        #    SmsStatusReport 从 accept_ingress 的白名单里漏掉了，此后每一条投递
        #    回执都被写成墓碑丢掉 —— 生产上现在还躺着 18 条
        #    `ingress kind SmsStatusReport is not a sequenced uplink kind`
        #    （2026-08-29 到 09-06）。
        #
        #    那次之后补的守卫（packages/db/tests/delivery_report.sql）点名的是
        #    **已经坏过的那两个**类型。契约一共定义 7 个可定序上行类型，而
        #    packages/db/tests 里 CommandResult、EsimInventory、Alert 一个都没有 ——
        #    下一次白名单漏的要是它们，测试照样全绿。
        #
        #    所以这一条从**契约**枚举，不点名：schema 里的 `sequenced` 标记就是
        #    那份名单，Go 和 Rust 两侧也都从它来。accept_ingress 已经被十一个
        #    CREATE OR REPLACE 整体重写过，第十二个漏掉哪一个都会在这里变红。
        #
        # ⚠️ 只认「被白名单拒绝」这一种失败。投影分支要更多字段是另一回事，
        #    把那也算失败就会变成一条为了绿而不断塞字段的测试。
        run: |
          set -euo pipefail
          kinds=$(python3 -c "
          import json
          schema = json.load(open('packages/contract/schema/edge-cloud.v1.schema.json'))
          catalog = schema['x-vodoge-message-catalog']
          print(' '.join(k for k, v in catalog.items() if v.get('sequenced')))")
          if [ -z "$kinds" ]; then
            echo "契约里一个可定序上行类型都没读出来 —— 这条检查会永远绿"
            exit 1
          fi
          echo "契约里的可定序上行类型: $kinds"
          for kind in $kinds; do
            # 🔴 显式看 psql 的退出码。第一版靠 `set -e` 兜底，本机实测：
            #    DO 块里的 RAISE 打在屏幕上，而这一步照样**退出 0** 并打印
            #    「收得下每一个」—— 一条发现了问题却报成功的检查。
            psql -h localhost -U vodoge -d vodoge -v ON_ERROR_STOP=1 -q <<SQL || { echo "上面那个类型没过，见 ERROR 行"; exit 1; }
          BEGIN;
          INSERT INTO app.tenants (id, slug, name, status, region)
          VALUES ('7c1d0000-0000-4000-8000-000000000001', 'kindcheck', 'kind check', 'active', 'cn');
          INSERT INTO app.devices (id, tenant_id, imei, name, vertical)
          VALUES ('7c1d0000-0000-4000-8000-000000000002',
                  '7c1d0000-0000-4000-8000-000000000001',
                  '869999999999999', 'kind-check', 'iot');
          DO \$\$
          BEGIN
              PERFORM set_config('app.tenant_id', '7c1d0000-0000-4000-8000-000000000001', true);
              BEGIN
                  PERFORM app.accept_ingress(
                      '7c1d0000-0000-4000-8000-000000000001'::uuid,
                      '7c1d0000-0000-4000-8000-000000000002'::uuid,
                      1::bigint,
                      gen_random_uuid(),
                      '$kind',
                      '{"kind":"$kind"}'::jsonb);
              EXCEPTION WHEN OTHERS THEN
                  IF SQLERRM LIKE '%is not a sequenced uplink kind%' THEN
                      RAISE EXCEPTION
                          'accept_ingress 不收契约里的上行类型 %，它会被写成墓碑丢掉', '$kind';
                  END IF;
                  -- 其它错误不算：投影分支要更多字段是另一回事。
              END;
          END
          \$\$;
          ROLLBACK;
          SQL
          done
          echo "accept_ingress 收得下契约定义的每一个可定序上行类型"
      - name: The database tests actually run
        env:
          PGPASSWORD: ci
        # 🔴 这一步此前不存在：packages/db/tests 下的十个 .sql 从来没有被执行过，
        #    仓库里也没有别的 runner。代价是具体的 —— 0044 那次 CREATE OR REPLACE
        #    静默删掉了 accept_ingress 的 SmsStatusReport 分支，此后十一天里每一条
        #    投递回执都被写成 Unstorable 墓碑丢掉，而没有任何东西会变红。
        #
        #    runner 给每个测试单独建库（TEMPLATE），因为这些测试自带 COMMIT：
        #    共用一个库时红绿取决于文件名顺序。
        # 不复用上一步那个库：runner 自己建模板并重放一遍，这样它在本机和 CI 上
        #    跑的是同一条路径，也不依赖前面某一步留下的状态。
        run: PGHOST=localhost PG_USER=vodoge ./packages/db/run-tests.sh
      - name: Migrations are recorded
        env:
          PGPASSWORD: ci
        # The runner records each migration, so a mismatch means a file was
        # added to the directory in a way the runner could not parse.
        run: |
          files=$(ls packages/db/migrations/*.sql | wc -l)
          rows=$(psql -h localhost -U vodoge -d vodoge -tAc "SELECT count(*) FROM app.schema_migrations")
          echo "files=$files recorded=$rows"
          if [ "$files" -ne "$rows" ]; then
            echo "every migration must insert its own schema_migrations row"
            exit 1
          fi
