<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoDoge · 离线</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:2rem;
           background:#0b0e14; color:#e7ecf3;
           font-family: ui-sans-serif, system-ui, "PingFang SC", sans-serif; }
    .box { max-width: 34ch; text-align:center; display:grid; gap:.75rem; }
    h1 { font-size:1.25rem; margin:0; }
    p { color:#93a1b5; font-size:.9rem; margin:0; line-height:1.6; }
    .mark { width:40px; height:40px; border-radius:12px; margin:0 auto;
            background:linear-gradient(135deg,#4ade9b,#22c47f); display:grid;
            place-items:center; color:#06251a; font-weight:800; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">V</div>
    <h1>暂时连不上云端</h1>
    <p>控制台需要网络才能显示实时状态。恢复后刷新即可。</p>
    <p>现场调试可以直接用边缘面板，它断网也能工作。</p>
  </div>
</body>
</html>
