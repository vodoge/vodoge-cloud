name: vodoge-cloud

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      VODOGE_OWNER_USER: ${VODOGE_OWNER_USER:?set VODOGE_OWNER_USER in .env}
      VODOGE_OWNER_PASSWORD: ${VODOGE_OWNER_PASSWORD:?set VODOGE_OWNER_PASSWORD in .env}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --protected-mode yes --bind 0.0.0.0
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: postgres:18.4-alpine
    profiles: ["migrate"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VODOGE_OWNER_USER: ${VODOGE_OWNER_USER:?set VODOGE_OWNER_USER in .env}
      VODOGE_OWNER_PASSWORD: ${VODOGE_OWNER_PASSWORD:?set VODOGE_OWNER_PASSWORD in .env}
      VODOGE_APP_USER: ${VODOGE_APP_USER:?set VODOGE_APP_USER in .env}
      VODOGE_APP_PASSWORD: ${VODOGE_APP_PASSWORD:?set VODOGE_APP_PASSWORD in .env}
    volumes:
      - ../packages/db:/workspace/packages/db:ro
      - ./migrate.sh:/workspace/deploy/migrate.sh:ro
    entrypoint: ["sh", "/workspace/deploy/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  gateway:
    # Pinned, so that the tag bin/deploy.sh builds is the tag Compose runs.
    # Compose derives the same name from project + service today; stating it
    # means a rename cannot silently point the two halves at different tags.
    image: vodoge-cloud-gateway
    # This stanza deliberately stays, and deliberately still points at the
    # from-source Dockerfile -- which now refuses to run on anything that has
    # not passed VODOGE_BUILD_FROM_SOURCE=yes. It looks backwards; it is not.
    #
    # Removing `build:` was the first instinct and is worse: `docker compose
    # build gateway` then prints "No services to build" and exits 0 (verified
    # on this host, Compose v5.4.0), so the operator believes a fresh image
    # exists, runs `up -d`, and gets the old one. Pointing it at
    # Dockerfile.gateway.prebuilt is worse in the same direction: it succeeds
    # cheaply even when deploy/vodoge-gateway is weeks stale. A container
    # quietly serving old code is a nastier failure than a box that fell over,
    # because nothing about it looks wrong.
    #
    # So the stanza stays and the Dockerfile is what says no: in under a
    # second, before any toolchain image is pulled, printing the two commands
    # that do work. See deploy/Dockerfile.gateway and deploy/RUNBOOK.md.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      VODOGE_GATEWAY_ADDR: :8080
      VODOGE_GATEWAY_TLS_ADDR: :8443
      VODOGE_GATEWAY_REGION: ${VODOGE_GATEWAY_REGION:-cn}
      VODOGE_BASE_DOMAIN: ${VODOGE_BASE_DOMAIN:-vodoge.com}
      VODOGE_DATABASE_URL: postgres://${VODOGE_APP_USER:?set VODOGE_APP_USER in .env}:${VODOGE_APP_PASSWORD:?set VODOGE_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      VODOGE_GATEWAY_NODE_ID: ${VODOGE_GATEWAY_NODE_ID:-gateway}
      VODOGE_GATEWAY_TLS_CERT: /certs/gateway.crt
      VODOGE_GATEWAY_TLS_KEY: /certs/gateway.key
      VODOGE_GATEWAY_CLIENT_CA: /certs/device-ca.crt
      VODOGE_DEVICE_CA_CERT: /certs/device-ca.crt
      VODOGE_DEVICE_CA_KEY: /certs/device-ca.key
      # Who to tell when a job outside any request fails, and the secret that
      # job authenticates with. Both empty by default: the route answers 503
      # until an operator picks a tenant, because nothing here can pick one --
      # RLS means not even the gateway can list the tenants it serves.
      VODOGE_OPS_TENANT: ${VODOGE_OPS_TENANT:-}
      VODOGE_OPS_TOKEN: ${VODOGE_OPS_TOKEN:-}
      # 谁的转述地址算数。控制台把每一个 /v1 请求转发给网关（浏览器的 /v1/*
      # 走 Next 的 rewrite，登录走 /api/auth/login 里的服务端 fetch），所以
      # 网关看到的对端**永远**是 console 容器 —— 不把它认出来的话，登录限流
      # 就是全平台共用一个桶：任何人打五次废凭据，之后每个租户的每位运维都
      # 登不进去。
      #
      # ⚠️ 写的是 backend 这一段，不是「所有私网地址」：范围越大，能自己挑
      #    限流桶的东西越多。这一段之外的对端送来那个头会被忽略**并且记一条
      #    警告** —— docker 重编网段时，那条警告就是唯一的声音。
      VODOGE_TRUSTED_PROXIES: ${VODOGE_TRUSTED_PROXIES:-172.20.0.0/16}
    volumes:
      - ./certs:/certs:ro
    ports:
      - 127.0.0.1:${VODOGE_GATEWAY_PORT:-18080}:8080
      - ${VODOGE_EDGE_TLS_PORT:-444}:8443
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      backend:
        # 🔴 网络内别名。容器名 `gateway` 在这三张网上都有记录，而 DNS 交出
        #    哪一个由不得我们挑 —— 2026-09-18 实测，console 解析 `gateway`
        #    拿到的是 **172.19.0.6**，也就是 `trek_default`（ingress）那一张：
        #    控制台到网关的每一个请求（带着会话令牌）都在跟 trek / anki /
        #    rustdesk 同一张网上走，而不是在这张 internal 的 backend 上。
        #
        #    这个别名只在 backend 上有记录，所以解析它必然落到 172.20.x，
        #    内核也就必然从 backend 那张网卡发出去。限流的信任名单
        #    （VODOGE_TRUSTED_PROXIES）据此才写得准 —— 而这件事正是那条
        #    「不在信任名单里的对端转述了调用方地址」的警告抓出来的。
        aliases:
          - gateway-backend
      edge:
      # And ingress, so Caddy can reach it by container name.
      ingress:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 8s

  console:
    # Pinned for the same reason as the gateway above, and refusing to build
    # here for the same reason: `next build` needs more memory than this host
    # has. deploy/Dockerfile.console carries the refusal.
    image: vodoge-cloud-console
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
    restart: unless-stopped
    environment:
      # 走 backend 上那个网络内别名，不走容器名 —— 容器名会解析到
      # trek_default 那张与第三方容器共用的网。见 gateway 服务里的 aliases。
      VODOGE_GATEWAY_URL: http://gateway-backend:8080
      VODOGE_BASE_DOMAIN: ${VODOGE_BASE_DOMAIN:-vodoge.com}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - 127.0.0.1:${VODOGE_CONSOLE_PORT:-13000}:3000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      # backend is internal, and Docker silently ignores published ports for a
      # container attached only to an internal network. The console has to be
      # reachable from the host, so it joins edge as well — the same reason the
      # gateway does.
      - backend
      - edge
      # And ingress, so Caddy can reach it by container name.
      - ingress

  admin:
    # 跨租户管理站。写「哪些硬件受支持」「哪些型号 × 运营商测过」，租户只读。
    #
    # 钉住 image 的理由和上面两个一样。**没有 build 段**：它的源码在另一个
    # 仓库（vodoge-admin），这台机器上根本没有，所以连「拒绝在此构建」都
    # 无从谈起 —— 唯一的路就是 bin/deploy.sh admin 拿 tarball 打包。
    image: vodoge-cloud-admin
    restart: unless-stopped
    environment:
      # 走 backend 上那个网络内别名，不走容器名 —— 容器名会解析到
      # trek_default 那张与第三方容器共用的网。见 gateway 服务里的 aliases。
      VODOGE_GATEWAY_URL: http://gateway-backend:8080
      VODOGE_BASE_DOMAIN: ${VODOGE_BASE_DOMAIN:-vodoge.com}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # 只发布到回环。对外由 Caddy 按 hostname 分派，而 admin 的那一段
    # **必须**带客户端证书校验 —— 见 docs/device-catalogue.md 的鉴权一节。
    # 🔴 在那段配置到位之前，不要把这个站解析到公网。
    ports:
      - 127.0.0.1:${VODOGE_ADMIN_PORT:-13100}:3000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend
      - edge
      - ingress

networks:
  backend:
    internal: true
  edge:
    driver: bridge
  # The reverse proxy that owns 80/443 on this host runs in TREK's compose
  # project, so reaching it means joining its network.
  #
  # The alternative was to publish the console and gateway on the docker bridge
  # address and have Caddy dial that. It does not work and fails confusingly:
  # a port published to 127.0.0.1 is reachable from the host's loopback and not
  # from a bridge address, so Caddy answered 502 for both hostnames while every
  # check run on the host itself passed. Sharing a network removes the host's
  # networking from the path entirely — Caddy resolves the container by name.
  ingress:
    external: true
    name: trek_default

volumes:
  postgres-data:
  redis-data:
