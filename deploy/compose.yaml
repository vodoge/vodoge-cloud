name: vodoge-cloud

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      VODOGE_OWNER_USER: ${VODOGE_OWNER_USER:?set VODOGE_OWNER_USER in .env}
      VODOGE_OWNER_PASSWORD: ${VODOGE_OWNER_PASSWORD:?set VODOGE_OWNER_PASSWORD in .env}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --protected-mode yes --bind 0.0.0.0
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: postgres:18.4-alpine
    profiles: ["migrate"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VODOGE_OWNER_USER: ${VODOGE_OWNER_USER:?set VODOGE_OWNER_USER in .env}
      VODOGE_OWNER_PASSWORD: ${VODOGE_OWNER_PASSWORD:?set VODOGE_OWNER_PASSWORD in .env}
    volumes:
      - ../packages/db:/workspace/packages/db:ro
      - ./migrate.sh:/workspace/deploy/migrate.sh:ro
    entrypoint: ["sh", "/workspace/deploy/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      VODOGE_GATEWAY_ADDR: :8080
    ports:
      - 127.0.0.1:${VODOGE_GATEWAY_PORT:-18080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
